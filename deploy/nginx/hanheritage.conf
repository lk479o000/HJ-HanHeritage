# 合江汉代画像石棺数字化保护与展示利用（二期）— Nginx 站点配置示例
# 用法：复制到 /etc/nginx/conf.d/hanheritage.conf，按实际域名、静态目录、证书路径修改后
#      nginx -t && systemctl reload nginx
#
# 架构：浏览器 → Nginx :80/:443 → 静态文件 hanheritage-web/dist
#                                     → /api、/uploads 反向代理 127.0.0.1:3083
#
# CORS 说明：
# - 前后端经由本配置同域访问时，浏览器不会触发跨域；后端 enableCors({ origin: true, credentials: true })
#   仅在直接跨域访问时生效，本配置不要重复添加 Access-Control-* 响应头，避免出现重复头。
# - 反向代理需保留 Host、Origin 等请求头（Nginx 默认全部转发），否则后端来源判断与 JWT 流程可能异常。
# - 若前后端拆分到不同域名，请在后端限制允许的 origin，不要使用通配来源 + credentials 的组合。
#
# 上传目录说明：
# - 后端上传上限为 500MB（multer fileSize），client_max_body_size 需不低于该值并留余量。
# - 后端将上传文件落盘到「进程工作目录/uploads」并静态托管在 /uploads/，因此启动后端时工作目录必须是
#   hanheritage-api（deploy/start-prod.sh 已处理）。多实例部署时需将 uploads 目录挂载为共享存储，
#   或改为直连 Nginx alias；仅用一台应用服务器时按下方代理方式即可。

upstream hanheritage_api {
    server 127.0.0.1:3083;
    keepalive 32;
}

server {
    listen 80;
    server_name _;  # 改为实际域名，例如 heritage.example.com

    root /var/www/hanheritage-web;  # 指向 hanheritage-web/dist 的部署目录
    index index.html;

    # 与后端 500MB 上传上限匹配
    client_max_body_size 600m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml font/woff2;

    # SPA 路由（vue-router history 模式），未匹配的路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 首页与入口文件不缓存，保证发版后立即生效
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 业务接口反向代理（保留 /api 前缀，后端全局前缀为 api/v1）
    location /api/ {
        proxy_pass http://hanheritage_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 上传文件由后端静态托管；大文件下载建议同时开启 sendfile（http 块默认已开启）
    location /uploads/ {
        proxy_pass http://hanheritage_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        expires 7d;
        add_header Cache-Control "public";
    }

    # 健康检查入口：探测后端公开接口（返回 {"code":200,...} 即正常）
    location = /healthz {
        access_log off;
        proxy_pass http://hanheritage_api/api/v1/visitor/cliffs;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # HTTPS 示例：证书就绪后取消注释，并将上方 listen 80 改为跳转
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/heritage.example.com.pem;
    # ssl_certificate_key /etc/nginx/ssl/heritage.example.com.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
}

# 如需 HTTP 强制跳转 HTTPS，可在证书启用后增加：
# server {
#     listen 80;
#     server_name heritage.example.com;
#     return 301 https://$host$request_uri;
# }
