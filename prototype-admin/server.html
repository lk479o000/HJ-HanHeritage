<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>服务器 — 管理后台</title>
  <link rel="stylesheet" href="assets/admin.css" />
  <link rel="stylesheet" href="assets/embed.css" />
  <script src="assets/embed.js"></script>
</head>
<body class="admin-body">
  <div class="admin-root">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-wrap">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-main">
        <h1 class="admin-page-title">服务器</h1>
        <p class="admin-page-desc">硬件与系统信息 · 虚拟机监控（原需求 3.12）</p>

        <div class="admin-card">
          <h2>硬件与系统</h2>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <tbody>
                <tr>
                  <th style="width: 180px">CPU</th>
                  <td>8 vCPU（占位）</td>
                </tr>
                <tr>
                  <th>内存</th>
                  <td>16 GB · 使用率 42%</td>
                </tr>
                <tr>
                  <th>磁盘</th>
                  <td>系统盘 200GB · 数据盘 1TB</td>
                </tr>
                <tr>
                  <th>操作系统</th>
                  <td>Linux x86_64</td>
                </tr>
                <tr>
                  <th>IP</th>
                  <td>192.168.1.100</td>
                </tr>
                <tr>
                  <th>架构</th>
                  <td>x86_64</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>

        <div class="admin-card">
          <h2>虚拟机监控</h2>
          <p class="admin-page-desc" style="margin-top: 0">虚拟机硬件与运行状态（与「服务监控」配合）</p>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>虚拟机</th>
                  <th>状态</th>
                  <th>CPU</th>
                  <th>内存</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>app-vm-01</td>
                  <td><span class="tag">运行中</span></td>
                  <td>35%</td>
                  <td>6.2 / 8 GB</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <script src="assets/admin-layout.js"></script>
  <script>
    if (!document.documentElement.classList.contains("embed-mode")) {
      AdminLayout.init({ active: "server" });
    } else {
      AdminLayout.initTabs(document);
    }
  </script>
</body>
</html>
