<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>操作日志 — 管理后台</title>
  <link rel="stylesheet" href="assets/admin.css" />
  <link rel="stylesheet" href="assets/embed.css" />
  <script src="assets/embed.js"></script>
</head>
<body class="admin-body">
  <div class="admin-root">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-wrap">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-main">
        <h1 class="admin-page-title">操作日志</h1>
        <p class="admin-page-desc">记录系统操作；支持按日期与关键字筛选、删除所选、导出当前结果 CSV；清空为扩展能力演示。</p>
        <div class="admin-card">
          <div class="admin-toolbar" style="flex-wrap:wrap;gap:8px">
            <input class="admin-input" id="log-op-start" type="date" title="开始日期" />
            <span style="align-self:center;color:var(--admin-muted)">至</span>
            <input class="admin-input" id="log-op-end" type="date" title="结束日期" />
            <input class="admin-input" id="log-op-keyword" type="search" placeholder="用户 / 模块 / 操作 / 详情 / IP" style="max-width:240px" />
            <button type="button" class="btn btn-primary" id="log-op-search">查询</button>
            <button type="button" class="btn" id="log-op-export">导出</button>
            <button type="button" class="btn btn-danger" id="log-op-del">删除所选</button>
            <button type="button" class="btn btn-danger" id="log-op-clear">清空日志 <span class="tag tag-ext">扩展</span></button>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th style="width:40px"><input type="checkbox" id="log-op-check-all" title="全选当前页" /></th>
                  <th>时间</th>
                  <th>用户</th>
                  <th>模块</th>
                  <th>操作</th>
                  <th>详情</th>
                  <th>终端 IP</th>
                </tr>
              </thead>
              <tbody id="log-op-tbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>
  <div class="admin-toast" id="log-op-toast" aria-live="polite"></div>
  <script src="assets/admin-layout.js"></script>
  <script src="assets/log-monitor-store.js"></script>
  <script src="assets/org-common.js"></script>
  <script src="assets/log-operation-page.js"></script>
  <script>
    if (!document.documentElement.classList.contains("embed-mode")) {
      AdminLayout.init({ active: "log-op" });
    } else {
      AdminLayout.initTabs(document);
    }
  </script>
</body>
</html>
