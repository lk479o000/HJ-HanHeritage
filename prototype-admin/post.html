<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>岗位管理 — 管理后台</title>
  <link rel="stylesheet" href="assets/admin.css" />
  <link rel="stylesheet" href="assets/org-admin.css" />
  <link rel="stylesheet" href="assets/embed.css" />
  <script src="assets/embed.js"></script>
</head>
<body class="admin-body">
  <div class="admin-root">
    <aside class="admin-sidebar" id="admin-sidebar"></aside>
    <div class="admin-wrap">
      <header class="admin-topbar" id="admin-topbar"></header>
      <main class="admin-main">
        <h1 class="admin-page-title">岗位管理</h1>
        <p class="admin-page-desc">多级岗位树；支持增删改查，并在表单中勾选岗位级功能权限（与用户管理中的岗位多选联动）。</p>
        <div class="admin-card">
          <div class="admin-toolbar">
            <button type="button" class="btn btn-primary" id="post-btn-add">新增岗位</button>
          </div>
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th>岗位名称</th>
                  <th>上级岗位</th>
                  <th>权限摘要</th>
                  <th>操作</th>
                </tr>
              </thead>
              <tbody id="post-tbody"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="admin-modal-backdrop" id="post-modal" hidden aria-hidden="true">
    <div class="admin-modal admin-modal--lg" role="dialog" aria-modal="true" aria-labelledby="post-modal-title">
      <div class="admin-modal-header">
        <h2 class="admin-modal-title" id="post-modal-title">新增岗位</h2>
        <button type="button" class="admin-modal-close" data-org-modal-close aria-label="关闭">&times;</button>
      </div>
      <div class="admin-modal-body">
        <div class="admin-form-row">
          <label for="post-f-name">岗位名称</label>
          <input type="text" class="admin-input" id="post-f-name" />
        </div>
        <div class="admin-form-row">
          <label for="post-f-parent">上级岗位</label>
          <select class="admin-select" id="post-f-parent"></select>
        </div>
        <div class="admin-form-row">
          <label for="post-f-sort">排序</label>
          <input type="number" class="admin-input" id="post-f-sort" style="max-width:120px" />
        </div>
        <div class="admin-form-row">
          <label for="post-f-remark">说明</label>
          <textarea class="admin-textarea" id="post-f-remark" rows="2"></textarea>
        </div>
        <div class="admin-form-row">
          <label>功能权限</label>
          <div id="post-perm-wrap"></div>
        </div>
      </div>
      <div class="admin-modal-footer">
        <button type="button" class="btn btn-ghost" data-org-modal-close>取消</button>
        <button type="button" class="btn btn-primary" id="post-btn-save">保存</button>
      </div>
    </div>
  </div>
  <div class="admin-toast" id="post-toast" aria-live="polite"></div>

  <script src="assets/admin-layout.js"></script>
  <script src="assets/org-store.js"></script>
  <script src="assets/org-permissions.js"></script>
  <script src="assets/org-common.js"></script>
  <script src="assets/post-page.js"></script>
  <script>
    if (!document.documentElement.classList.contains("embed-mode")) {
      AdminLayout.init({ active: "post" });
    } else {
      AdminLayout.initTabs(document);
    }
  </script>
</body>
</html>
